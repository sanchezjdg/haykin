    <style>
        /* Fixed sensor data toggle button */
        #sensor-data-btn { position: fixed; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #sensor-data-btn:hover { background: rgba(0,0,0,0.8); }
        #clear-data-btn { position: fixed; top: 10px; right: 100px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #clear-data-btn:hover { background: rgba(0,0,0,0.8); }
        #graphs-btn { position: fixed; top: 10px; right: 190px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #graphs-btn:hover { background: rgba(0,0,0,0.8); }
        #trajectory-btn { position: fixed; top: 10px; right: 280px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #trajectory-btn:hover { background: rgba(0,0,0,0.8); }
        #calibrate-btn { position: fixed; top: 10px; right: 380px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #calibrate-btn:hover { background: rgba(0,0,0,0.8); }
        #air-btn { position: fixed; top: 10px; right: 470px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #air-btn:hover { background: rgba(0,0,0,0.8); }
        #sensor-panel { position: fixed; top: 50px; right: 10px; width: 280px; background: rgba(20,20,20,0.9); color: #eee; border: 1px solid #555; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.7); font-family: sans-serif; display: none; z-index: 1000; }
        #sensor-panel.show { display: block; }
        #sensor-panel .header { background: rgba(40,40,40,0.95); padding: 6px 8px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #555; display: flex; justify-content: space-between; align-items: center; }
        #sensor-panel .header .close-btn { cursor: pointer; font-size: 16px; }
        #sensor-panel .content { padding: 8px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
        #graphs-panel { position: fixed; top: 50px; right: 300px; width: 1000px; height: 300px; background: rgba(20,20,20,0.9); color: #eee; border: 1px solid #555; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.7); font-family: sans-serif; display: none; z-index: 1000; }
        #graphs-panel.show { display: block; }
        #graphs-panel .header { background: rgba(40,40,40,0.95); padding: 6px 8px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #555; display: flex; justify-content: space-between; align-items: center; }
        #graphs-panel .header .close-btn { cursor: pointer; font-size: 16px; }
        #graphs-content { padding: 8px; height: calc(100% - 40px); overflow: hidden; }
        .axis text { fill: #ccc; font-size: 11px; }
        .grid line { stroke: #333; stroke-opacity: 0.5; shape-rendering: crispEdges; }
        .grid path { stroke-width: 0; }
        .status-indicator {
            position: fixed;
            top: 480px;
            right: 10px;
            left: unset;
            background: rgba(20,20,20,0.9);
            color: #eee;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 1000;
        }
        .status-online { color: #00ff88; }
        .status-offline { color: #ff4444; }
        .trajectory-info { position: fixed; bottom: 10px; left: 10px; background: rgba(20,20,20,0.9); color: #eee; padding: 6px 12px; border-radius: 4px; font-family: sans-serif; font-size: 12px; z-index: 1000; }
        .compass-info { position: fixed; bottom: 130px; right: 10px; background: rgba(20,20,20,0.9); color: #eee; padding: 6px 12px; border-radius: 4px; font-family: sans-serif; font-size: 12px; z-index: 1000; }
        .calibration-status { color: #ffaa00; }
        .calibration-complete { color: #00ff88; }
    </style>
</head>
<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
        <div id="potree_render_area" style="background-image: url('./libs/potree/resources/images/background.jpg');"></div>
        <div id="potree_sidebar_container"></div>
    </div>
    <div id="status-indicator" class="status-indicator">
        <span id="connection-status" class="status-offline">● Offline</span>
    </div>
    <div id="trajectory-info" class="trajectory-info">
        <span id="trajectory-points">Trajectory Points: 0</span>
    </div>
    <!-- Panel de información de la brújula -->
    <div class="compass-info">
        <div id="compass-heading">Heading: ---°</div>
        <div id="compass-calibration" class="calibration-status">Not started</div>
    </div>    <!-- Panel del clima -->
    <div id="weather-panel" class="status-indicator" style="top: 280px;">Cargando clima...</div>
    <button id="sensor-data-btn">Data</button>
    <button id="clear-data-btn">Clear All</button>
    <button id="graphs-btn">Graphs</button>
    <button id="trajectory-btn">Toggle Path</button>
    <button id="calibrate-btn">Calibrate</button>
    <select id="device-select" style="position:fixed;top:10px;right:560px;z-index:1000;padding:6px 12px;border-radius:4px;font-size:15px;">
        <option value="">Todos los dispositivos</option>
    </select>
    <div id="sensor-panel">
        <div class="header"><span>Sensor Data</span><span class="close-btn">&times;</span></div>
        <div class="content" id="sensor-content">No data available</div>
    </div>
    <div id="graphs-panel">
        <div class="header"><span>Sensor Measurements</span><span class="close-btn">&times;</div>
        <div id="graphs-content"></div>
    </div>
    <!-- Brújula -->
    <div id="compass-container" style="position:fixed; bottom:10px; right:10px; z-index:1000;"></div>
    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <!-- Carga D3 v3 -->
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="../libs/three.js/build/three.min.js"></script>
    <script src="./libs/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>
    <script src="./graphs.js"></script>
    <script src="./weather.js"></script>
    <script>
        // Configuración de proyecciones
        proj4.defs('EPSG:4326', '+proj=longlat +datum=WGS84 +no_defs');
        proj4.defs('EPSG:32618', '+proj=utm +zone=18 +datum=WGS84 +units=m +no_defs');

        // Global variables
        window.deviceMarkers = new Map(); // Mapa de phone -> marker
        window.deviceTrajectories = new Map(); // Mapa de phone -> {points: [], measure: null}
        window.showTrajectory = true;
        window.selectedDevice = null;
        
        // Variables para calibración de la brújula
        window.magnetometerCalibration = {
            isCalibrating: false,
            isCalibrated: false,
            samples: [],
            maxSamples: 100,
            minX: Infinity,
            minY: Infinity,
            minZ: Infinity,
            maxX: -Infinity,
            maxY: -Infinity,
            maxZ: -Infinity,
            offsetX: 0,
            offsetY: 0,
            offsetZ: 0
        };

        async function populateDeviceSelect() {
            const select = document.getElementById('device-select');
            select.innerHTML = '<option value="">Cargando...</option>';
            try {
                const res = await fetch('/devices');
                const devices = await res.json();
                console.log('Devices found:', devices); // Debug log
                select.innerHTML = '<option value="">Todos los dispositivos</option>' +                    (devices.length ? devices.map(deviceId => 
                        `<option value="${deviceId}">${deviceId}</option>`).join('') : '');
                window.selectedDevice = '';
            } catch (err) {
                console.error('Error loading devices:', err);
                select.innerHTML = '<option value="">Error</option>';
            }
        }

        function updateConnectionStatus(online) {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = online ? '● Online' : '● Offline';
            statusEl.className = online ? 'status-online' : 'status-offline';
        }

        function updateTrajectoryInfo() {
            const infoEl = document.getElementById('trajectory-points');
            const totalPoints = Array.from(window.deviceTrajectories.values())
                .reduce((sum, traj) => sum + traj.points.length, 0);
            infoEl.textContent = `Trajectory Points: ${totalPoints}`;
        }

        function updateCompassInfo(heading, calibrationStatus) {
            document.getElementById('compass-heading').textContent = 
                heading !== null ? `Heading: ${Math.round(heading)}°` : 'Heading: ---°';
            
            const calibEl = document.getElementById('compass-calibration');
            calibEl.textContent = `Calibration: ${calibrationStatus}`;
            calibEl.className = calibrationStatus === 'Complete' ? 'calibration-complete' : 'calibration-status';
        }

        function startMagnetometerCalibration() {
            const cal = window.magnetometerCalibration;
            cal.isCalibrating = true;
            cal.samples = [];
            cal.minX = cal.minY = cal.minZ = Infinity;
            cal.maxX = cal.maxY = cal.maxZ = -Infinity;
            
            updateCompassInfo(null, 'In progress...');
            
            // Auto-stop calibration after 30 seconds
            setTimeout(() => {
                if (cal.isCalibrating) {
                    finishMagnetometerCalibration();
                }
            }, 30000);
        }

        function addCalibrationSample(magX, magY, magZ) {
            const cal = window.magnetometerCalibration;
            if (!cal.isCalibrating) return;
            
            cal.samples.push({x: magX, y: magY, z: magZ});
            
            // Update min/max for each axis
            cal.minX = Math.min(cal.minX, magX);
            cal.maxX = Math.max(cal.maxX, magX);
            cal.minY = Math.min(cal.minY, magY);
            cal.maxY = Math.max(cal.maxY, magY);
            cal.minZ = Math.min(cal.minZ, magZ);
            cal.maxZ = Math.max(cal.maxZ, magZ);
            
            // Auto-finish when we have enough samples
            if (cal.samples.length >= cal.maxSamples) {
                finishMagnetometerCalibration();
            }
        }

        function finishMagnetometerCalibration() {
            const cal = window.magnetometerCalibration;
            if (!cal.isCalibrating) return;
            
            cal.isCalibrating = false;
            
            // Calculate hard iron offset (center of the ellipsoid)
            cal.offsetX = (cal.maxX + cal.minX) / 2;
            cal.offsetY = (cal.maxY + cal.minY) / 2;
            cal.offsetZ = (cal.maxZ + cal.minZ) / 2;
            
            cal.isCalibrated = true;
            updateCompassInfo(null, 'Complete');
            
            console.log('Magnetometer calibration complete:', {
                offsetX: cal.offsetX,
                offsetY: cal.offsetY,
                offsetZ: cal.offsetZ
            });
        }

        function calculateCompassHeading(magX, magY, magZ) {
            const cal = window.magnetometerCalibration;
            
            // Apply calibration if available
            let calibratedX = magX;
            let calibratedY = magY;
            let calibratedZ = magZ;
            
            if (cal.isCalibrated) {
                calibratedX = magX - cal.offsetX;
                calibratedY = magY - cal.offsetY;
                calibratedZ = magZ - cal.offsetZ;
            }
            
            // Calculate heading (azimuth) in degrees
            // Note: This assumes the device is held flat (no tilt compensation)
            let heading = Math.atan2(calibratedY, calibratedX) * 180 / Math.PI;
            
            // Convert to 0-360 range
            if (heading < 0) {
                heading += 360;
            }
            
            // Convert from magnetic east to magnetic north
            // The magnetometer reading points towards magnetic field lines,
            // but we want the heading (direction the device is pointing)
            heading = (heading + 90) % 360;
            
            return heading;
        }

        function convertToWorldCoordinates(lat, lon, alt) {
            const [e, n] = proj4('EPSG:4326', 'EPSG:32618', [lon, lat]);
            return { x: e, y: n, z: alt + 34 };
        }

        function addToTrajectory(phone, x, y, z) {
            // Obtener o crear trayectoria para este dispositivo
            if (!window.deviceTrajectories.has(phone)) {
                window.deviceTrajectories.set(phone, {
                    points: [],
                    measure: null
                });
            }
            const trajectory = window.deviceTrajectories.get(phone);
            
            // Agregar punto a la lista de trayectoria
            trajectory.points.push(new THREE.Vector3(x, y, z));
            
            // Actualizar visualización si está visible
            updateTrajectoryVisibility(phone);
            updateTrajectoryInfo();
        }

        function updateTrajectoryVisibility(phone) {
            const trajectory = window.deviceTrajectories.get(phone);
            if (!trajectory) return;

            // Remover medida existente si hay
            if (trajectory.measure && window.viewer) {
                window.viewer.scene.removeMeasurement(trajectory.measure);
                trajectory.measure = null;
            }
            
            // Crear nueva medida si la trayectoria está visible y hay puntos
            if (window.showTrajectory && trajectory.points.length > 1 && window.viewer) {
                const measure = new Potree.Measure();
                measure.name = `Trajectory Path (${phone})`;
                measure.closed = false;
                measure.showCoordinates = false;
                measure.showAngles = false;
                measure.showArea = false;
                measure.showDistances = true;
                
                // Agregar todos los puntos de la trayectoria
                trajectory.points.forEach(point => {
                    measure.addMarker(point);
                });
                
                window.viewer.scene.addMeasurement(measure);
                trajectory.measure = measure;
            }
        }

        function toggleTrajectoryVisibility() {
            window.showTrajectory = !window.showTrajectory;
            
            // Actualizar todas las trayectorias
            window.deviceTrajectories.forEach((_, phone) => {
                updateTrajectoryVisibility(phone);
            });
            
            // Actualizar texto del botón
            const btn = document.getElementById('trajectory-btn');
            btn.textContent = window.showTrajectory ? 'Hide Path' : 'Show Path';
        }

        function clearTrajectory() {
            // Limpiar todas las trayectorias y marcadores
            window.deviceTrajectories.forEach(trajectory => {
                if (trajectory.measure && window.viewer) {
                    window.viewer.scene.removeMeasurement(trajectory.measure);
                }
            });
            window.deviceTrajectories.clear();
            
            window.deviceMarkers.forEach(marker => {
                if (marker && window.viewer) {
                    window.viewer.scene.removeMeasurement(marker);
                }
            });
            window.deviceMarkers.clear();
            
            updateTrajectoryInfo();
        }

        async function fetchCurrentData() {
            try {
                // Si está seleccionado "Todos los dispositivos", obtener la lista de dispositivos
                const phone = window.selectedDevice;
                let devices = [];
                
                if (!phone) {
                    try {
                        const devicesRes = await fetch('/devices');
                        devices = await devicesRes.json();
                    } catch (err) {
                        console.error('Error fetching devices:', err);
                        devices = [];
                    }
                } else {
                    devices = [phone];
                }

                // Obtener datos para cada dispositivo
                for (const devicePhone of devices) {
                    const res = await fetch('/latest?phone=' + encodeURIComponent(devicePhone));
                    if (!res.ok) continue;
                    
                    const data = await res.json();
                    console.log('Received data:', data); // Debug log
                    updateConnectionStatus(true);
                      // Verificar que tenemos las coordenadas necesarias
                    if (typeof data.latitude === 'number' && typeof data.longitude === 'number' && window.viewer) {
                        // Crear el punto en el mapa
                        const pos = new THREE.Vector3(data.x, data.y, data.z);
                        console.log('Position:', pos); // Debug log

                        // Process magnetometer data if available
                        if (data.mag_x !== undefined && data.mag_y !== undefined && data.mag_z !== undefined) {
                            // Add calibration sample if calibrating
                            if (window.magnetometerCalibration.isCalibrating) {
                                addCalibrationSample(data.mag_x, data.mag_y, data.mag_z);
                            }
                            
                            // Calculate and update compass heading
                            const heading = calculateCompassHeading(data.mag_x, data.mag_y, data.mag_z);
                            updateCompassInfo(heading, 
                                window.magnetometerCalibration.isCalibrated ? 'Complete' : 'Uncalibrated');
                            drawCompass(heading);
                        }
                        
                        // Remover marcador anterior si existe
                        const oldMarker = window.deviceMarkers.get(devicePhone);
                        if (oldMarker) {
                            window.viewer.scene.removeMeasurement(oldMarker);
                        }

                        // Crear nuevo marcador
                        const measure = new Potree.Measure();
                        measure.name = `Position (${devicePhone})`;
                        measure.showCoordinates = true;
                        measure.maxMarkers = 1;
                        measure.addMarker(pos);
                        window.viewer.scene.addMeasurement(measure);
                        window.deviceMarkers.set(devicePhone, measure);
                        
                        // Actualizar trayectoria
                        if (window.showTrajectory) {
                            addToTrajectory(devicePhone, data.x, data.y, data.z);
                        }
                    } else {
                        console.error('Invalid coordinates in data:', data);
                    }

                    // Display current sensor data
                    if (devicePhone === phone) {
                        document.getElementById('sensor-content').textContent = 
                            `Device: ${devicePhone}\n` +
                            `Position: (${data.x.toFixed(2)}, ${data.y.toFixed(2)}, ${data.z.toFixed(2)})\n` +
                            `Lat/Long: ${data.latitude.toFixed(6)}, ${data.longitude.toFixed(6)}\n` +
                            `Altitude: ${data.altitude || 0} m\n` +
                            `Light Level: ${data.light_level || 'N/A'} lx\n` +
                            `Pressure: ${data.pressure || 'N/A'} hPa\n` +
                            `Sound Level: ${data.sound_level || 'N/A'} dB\n` +
                            `Timestamp: ${new Date().toLocaleTimeString()}`;
                    }
                }
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('sensor-content').textContent = 'Error: Cannot fetch data';
                updateConnectionStatus(false);
            }
        }

        // Dibuja la brújula SVG en el contenedor
        function drawCompass(angleDeg) {
            const size = 110;
            const center = size / 2;
            const radius = 45;
            let needleX = center, needleY = center;
            
            if (typeof angleDeg === 'number') {
                // Convert heading to needle position
                // Heading 0° = North, 90° = East, etc.
                const rad = (angleDeg - 90) * Math.PI / 180;
                needleX = center + radius * 0.8 * Math.cos(rad);
                needleY = center + radius * 0.8 * Math.sin(rad);
            }
            
            // Determine needle color based on calibration status
            const needleColor = window.magnetometerCalibration.isCalibrated ? '#ff3333' : '#ffaa00';
            
            document.getElementById('compass-container').innerHTML = `
                <svg width="${size}" height="${size}">
                    <circle cx="${center}" cy="${center}" r="${radius}" fill="#222" stroke="#fff" stroke-width="3"/>
                    <!-- Cardinales -->
                    <text x="${center}" y="${center-33}" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">N</text>
                    <text x="${center+33}" y="${center+5}" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">E</text>
                    <text x="${center}" y="${center+40}" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">S</text>
                    <text x="${center-33}" y="${center+5}" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">W</text>
                    <!-- Aguja -->
                    <line x1="${center}" y1="${center}" x2="${needleX}" y2="${needleY}" stroke="${needleColor}" stroke-width="4" stroke-linecap="round"/>
                    <!-- Punta de la aguja (norte) -->
                    <circle cx="${needleX}" cy="${needleY}" r="3" fill="${needleColor}"/>
                    <!-- Centro -->
                    <circle cx="${center}" cy="${center}" r="6" fill="#fff" stroke="${needleColor}" stroke-width="2"/>
                    <!-- Marcas de grados -->
                    ${generateDegreeMarks(center, radius)}
                </svg>
            `;
        }

        function generateDegreeMarks(center, radius) {
            let marks = '';
            for (let i = 0; i < 360; i += 30) {
                const rad = (i - 90) * Math.PI / 180;
                const x1 = center + (radius - 8) * Math.cos(rad);
                const y1 = center + (radius - 8) * Math.sin(rad);
                const x2 = center + (radius - 3) * Math.cos(rad);
                const y2 = center + (radius - 3) * Math.sin(rad);
                marks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="2"/>`;
            }
            return marks;
        }

        window.addEventListener('load', function() {
            // Event listeners setup
            const sensorBtn = document.getElementById('sensor-data-btn');
            const sensorPanel = document.getElementById('sensor-panel');
            const sensorCloseBtn = document.querySelector('#sensor-panel .close-btn');
            const clearBtn = document.getElementById('clear-data-btn');
            const trajectoryBtn = document.getElementById('trajectory-btn');
            const calibrateBtn = document.getElementById('calibrate-btn');
            const airBtn = document.getElementById('air-btn');
            const deviceSelect = document.getElementById('device-select');

            // Sensor panel toggle
            sensorBtn.onclick = function() {
                sensorPanel.classList.toggle('show');
                if (sensorPanel.classList.contains('show')) fetchCurrentData();
            };
            
            sensorCloseBtn.onclick = function() {
                sensorPanel.classList.remove('show');
            };

            // Trajectory toggle button
            trajectoryBtn.onclick = function() {
                toggleTrajectoryVisibility();
            };

            // Calibration button
            calibrateBtn.onclick = function() {
                if (window.magnetometerCalibration.isCalibrating) {
                    finishMagnetometerCalibration();
                    calibrateBtn.textContent = 'Calibrate';
                } else {
                    startMagnetometerCalibration();
                    calibrateBtn.textContent = 'Stop Cal.';
                }
            };

            // Clear data button
            clearBtn.onclick = function() {
                if (window.viewer) {
                    window.viewer.scene.removeAllMeasurements();
                    window.latestMarker = null;
                }
                // Clear trajectory
                clearTrajectory();
                
                // Limpia los datos de graphs.js
                if (window.data && Array.isArray(window.data)) {
                    window.data.length = 0;
                    if (window.path && window.line) {
                        window.path.datum(window.data).attr('d', window.line);
                    }
                }
                document.getElementById('sensor-content').textContent = 'Data cleared';
            };

            // Device selector change
            deviceSelect.onchange = function() {
                window.selectedDevice = deviceSelect.value;
                if (window.viewer) {
                    window.viewer.scene.removeAllMeasurements();
                    window.latestMarker = null;
                }
                clearTrajectory();
                fetchCurrentData();
            };

            // Initialize Potree viewer
            if (!window.THREE && window.Potree) window.THREE = Potree.THREE;
            
            window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
            window.viewer.setEDLEnabled(true);
            window.viewer.setFOV(60);
            window.viewer.setPointBudget(2000000);
            window.viewer.loadSettingsFromURL();
            window.viewer.setDescription("");
            
            window.viewer.loadGUI(function() {
                window.viewer.setLanguage('en');
                if (window.$ && window.$.fn) {
                    $("#menu_appearance").next().show();
                    $("#menu_tools").next().show();
                    $("#menu_clipping").next().show();
                }
                window.viewer.toggleSidebar();
            });

            Potree.loadPointCloud(
                "./pointclouds/Malecon1/metadata.json",
                "Malecon1",
                function(e) {
                    const pc = e.pointcloud;
                    pc.material.size = 1;
                    pc.material.activeAttributeName = "composite";
                    pc.material.weightRGB = 0;
                    pc.material.weightElevation = 1;
                    pc.material.weightIntensity = 1;
                    pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
                    pc.material.shape = Potree.PointShape.PARABOLOID;
                    window.viewer.scene.addPointCloud(pc);
                    window.viewer.fitToScreen();
                    fetchCurrentData();
                    setInterval(fetchCurrentData, 5000);
                }
            );

            populateDeviceSelect();
        });
    </script>
</body>
</html>
