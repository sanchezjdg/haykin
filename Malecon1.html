<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haykin</title>
    <link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
    <style>
        /* Fixed sensor data toggle button */
        #sensor-data-btn { position: fixed; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #sensor-data-btn:hover { background: rgba(0,0,0,0.8); }
        #clear-data-btn { position: fixed; top: 10px; right: 100px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #clear-data-btn:hover { background: rgba(0,0,0,0.8); }
        #graphs-btn { position: fixed; top: 10px; right: 190px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #graphs-btn:hover { background: rgba(0,0,0,0.8); }
        #trajectory-btn { position: fixed; top: 10px; right: 280px; z-index: 1000; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: sans-serif; transition: background 0.2s; }
        #trajectory-btn:hover { background: rgba(0,0,0,0.8); }
        #sensor-panel { position: fixed; top: 50px; right: 10px; width: 280px; background: rgba(20,20,20,0.9); color: #eee; border: 1px solid #555; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.7); font-family: sans-serif; display: none; z-index: 1000; }
        #sensor-panel.show { display: block; }
        #sensor-panel .header { background: rgba(40,40,40,0.95); padding: 6px 8px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #555; display: flex; justify-content: space-between; align-items: center; }
        #sensor-panel .header .close-btn { cursor: pointer; font-size: 16px; }
        #sensor-panel .content { padding: 8px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
        #graphs-panel { position: fixed; top: 50px; right: 300px; width: 420px; height: 280px; background: rgba(20,20,20,0.9); color: #eee; border: 1px solid #555; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.7); font-family: sans-serif; display: none; z-index: 1000; }
        #graphs-panel.show { display: block; }
        #graphs-panel .header { background: rgba(40,40,40,0.95); padding: 6px 8px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #555; display: flex; justify-content: space-between; align-items: center; }
        #graphs-panel .header .close-btn { cursor: pointer; font-size: 16px; }
        #graphs-content { padding: 8px; height: calc(100% - 40px); overflow: hidden; }
        .axis text { fill: #ccc; font-size: 11px; }
        .axis path, .axis line { fill: none; stroke: #666; shape-rendering: crispEdges; }
        .grid line { stroke: #333; stroke-opacity: 0.5; shape-rendering: crispEdges; }
        .grid path { stroke-width: 0; }
        .status-indicator { position: fixed; top: 50px; left: 10px; background: rgba(20,20,20,0.9); color: #eee; padding: 6px 12px; border-radius: 4px; font-family: sans-serif; font-size: 12px; z-index: 1000; }
        .status-online { color: #00ff88; }
        .status-offline { color: #ff4444; }
        .trajectory-info { position: fixed; bottom: 10px; left: 10px; background: rgba(20,20,20,0.9); color: #eee; padding: 6px 12px; border-radius: 4px; font-family: sans-serif; font-size: 12px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
        <div id="potree_render_area" style="background-image: url('./libs/potree/resources/images/background.jpg');"></div>
        <div id="potree_sidebar_container"></div>
    </div>
    <div id="status-indicator" class="status-indicator">
        <span id="connection-status" class="status-offline">● Offline</span>
    </div>
    <div id="trajectory-info" class="trajectory-info">
        <span id="trajectory-points">Trajectory Points: 0</span>
    </div>
    <button id="sensor-data-btn">Data</button>
    <button id="clear-data-btn">Clear All</button>
    <button id="graphs-btn">Graphs</button>
    <button id="trajectory-btn">Toggle Path</button>
    <div id="sensor-panel">
        <div class="header"><span>Sensor Data</span><span class="close-btn">&times;</span></div>
        <div class="content" id="sensor-content">No data available</div>
    </div>
    <div id="graphs-panel">
        <div class="header"><span>Sensor Measurements</span><span class="close-btn">&times;</span></div>
        <div id="graphs-content"></div>
    </div>
    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <!-- Carga D3 v3 -->
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="../libs/three.js/build/three.min.js"></script>
    <script src="./libs/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>
    <script src="./graphs.js"></script>
    <script>
        // Configuración de proyecciones
        proj4.defs('EPSG:4326', '+proj=longlat +datum=WGS84 +no_defs');
        proj4.defs('EPSG:32618', '+proj=utm +zone=18 +datum=WGS84 +units=m +no_defs');

        // Global variables
        window.latestMarker = null;
        window.trajectoryMeasure = null;
        window.trajectoryPoints = [];
        window.showTrajectory = true;

        function updateConnectionStatus(online) {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = online ? '● Online' : '● Offline';
            statusEl.className = online ? 'status-online' : 'status-offline';
        }

        function updateTrajectoryInfo() {
            const infoEl = document.getElementById('trajectory-points');
            infoEl.textContent = `Trajectory Points: ${window.trajectoryPoints.length}`;
        }

        function convertToWorldCoordinates(lat, lon, alt) {
            const [e, n] = proj4('EPSG:4326', 'EPSG:32618', [lon, lat]);
            return { x: e, y: n, z: alt + 34 };
        }

        function addToTrajectory(x, y, z) {
            // Agregar punto a la lista de trayectoria
            window.trajectoryPoints.push(new THREE.Vector3(x, y, z));
            
            // Crear o actualizar la medida de trayectoria
            if (window.trajectoryMeasure && window.viewer) {
                window.viewer.scene.removeMeasurement(window.trajectoryMeasure);
            }
            
            if (window.showTrajectory && window.trajectoryPoints.length > 1 && window.viewer) {
                const measure = new Potree.Measure();
                measure.name = "Trajectory Path";
                measure.closed = false;
                measure.showCoordinates = false;
                measure.showAngles = false;
                measure.showArea = false;
                measure.showDistances = true;
                
                // Agregar todos los puntos de la trayectoria
                window.trajectoryPoints.forEach(point => {
                    measure.addMarker(point);
                });
                
                window.viewer.scene.addMeasurement(measure);
                window.trajectoryMeasure = measure;
            }
            
            updateTrajectoryInfo();
        }

        function toggleTrajectoryVisibility() {
            window.showTrajectory = !window.showTrajectory;
            
            if (!window.showTrajectory && window.trajectoryMeasure && window.viewer) {
                window.viewer.scene.removeMeasurement(window.trajectoryMeasure);
                window.trajectoryMeasure = null;
            } else if (window.showTrajectory && window.trajectoryPoints.length > 1) {
                // Recrear la trayectoria
                const measure = new Potree.Measure();
                measure.name = "Trajectory Path";
                measure.closed = false;
                measure.showCoordinates = false;
                measure.showAngles = false;
                measure.showArea = false;
                measure.showDistances = true;
                
                window.trajectoryPoints.forEach(point => {
                    measure.addMarker(point);
                });
                
                window.viewer.scene.addMeasurement(measure);
                window.trajectoryMeasure = measure;
            }
            
            // Actualizar texto del botón
            const btn = document.getElementById('trajectory-btn');
            btn.textContent = window.showTrajectory ? 'Hide Path' : 'Show Path';
        }

        function clearTrajectory() {
            if (window.trajectoryMeasure && window.viewer) {
                window.viewer.scene.removeMeasurement(window.trajectoryMeasure);
                window.trajectoryMeasure = null;
            }
            window.trajectoryPoints = [];
            updateTrajectoryInfo();
        }

        async function fetchCurrentData() {
            try {
                const res = await fetch('/latest');
                if (!res.ok) { 
                    document.getElementById('sensor-content').textContent = 'Error: Cannot connect to server'; 
                    updateConnectionStatus(false); 
                    return; 
                }
                const data = await res.json();
                updateConnectionStatus(true);
                
                // Display current sensor data
                document.getElementById('sensor-content').textContent =
                    `Light Level: ${data.light_level || 'N/A'} lx\n` +
                    `Pressure: ${data.pressure || 'N/A'} hPa\n` +
                    `Sound Level: ${data.sound_level || 'N/A'} dB\n` +
                    `Magnetic Field (µT):\n  X: ${data.mag_x || 'N/A'}\n  Y: ${data.mag_y || 'N/A'}\n  Z: ${data.mag_z || 'N/A'}\n` +
                    `Timestamp: ${new Date().toLocaleTimeString()}`;

                // Update marker on point cloud and add to trajectory
                if (window.latestMarker && window.viewer) {
                    window.viewer.scene.removeMeasurement(window.latestMarker);
                }
                
                if (typeof data.latitude === 'number' && typeof data.longitude === 'number' && window.viewer) {
                    const { x, y, z } = convertToWorldCoordinates(data.latitude, data.longitude, data.altitude || 0);
                    
                    // Current position marker
                    const meas = new Potree.Measure();
                    meas.name = "Current Position";
                    meas.showCoordinates = true;
                    meas.maxMarkers = 1;
                    meas.addMarker(new THREE.Vector3(x, y, z));
                    window.viewer.scene.addMeasurement(meas);
                    window.latestMarker = meas;
                    
                    // Add to trajectory (only if position has changed significantly)
                    const lastPoint = window.trajectoryPoints[window.trajectoryPoints.length - 1];
                    if (!lastPoint || lastPoint.distanceTo(new THREE.Vector3(x, y, z)) > 1.0) {
                        addToTrajectory(x, y, z);
                    }
                }

            } catch (err) { 
                console.error('Fetch error:', err); 
                document.getElementById('sensor-content').textContent = 'Error: Cannot fetch data';
                updateConnectionStatus(false);
            }
        }

        window.addEventListener('load', function() {
            // Event listeners setup
            const sensorBtn = document.getElementById('sensor-data-btn');
            const sensorPanel = document.getElementById('sensor-panel');
            const sensorCloseBtn = document.querySelector('#sensor-panel .close-btn');
            const clearBtn = document.getElementById('clear-data-btn');
            const trajectoryBtn = document.getElementById('trajectory-btn');

            // Sensor panel toggle
            sensorBtn.onclick = function() {
                sensorPanel.classList.toggle('show');
                if (sensorPanel.classList.contains('show')) fetchCurrentData();
            };
            
            sensorCloseBtn.onclick = function() {
                sensorPanel.classList.remove('show');
            };

            // Trajectory toggle button
            trajectoryBtn.onclick = function() {
                toggleTrajectoryVisibility();
            };

            // Clear data button
            clearBtn.onclick = function() {
                if (window.viewer) {
                    window.viewer.scene.removeAllMeasurements();
                    window.latestMarker = null;
                }
                // Clear trajectory
                clearTrajectory();
                
                // Limpia los datos de graphs.js
                if (window.data && Array.isArray(window.data)) {
                    window.data.length = 0;
                    if (window.path && window.line) {
                        window.path.datum(window.data).attr('d', window.line);
                    }
                }
                document.getElementById('sensor-content').textContent = 'Data cleared';
            };

            // Initialize Potree viewer
            if (!window.THREE && window.Potree) window.THREE = Potree.THREE;
            
            window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
            window.viewer.setEDLEnabled(true);
            window.viewer.setFOV(60);
            window.viewer.setPointBudget(2000000);
            window.viewer.loadSettingsFromURL();
            window.viewer.setDescription("");
            
            window.viewer.loadGUI(function() {
                window.viewer.setLanguage('en');
                if (window.$ && window.$.fn) {
                    $("#menu_appearance").next().show();
                    $("#menu_tools").next().show();
                    $("#menu_clipping").next().show();
                }
                window.viewer.toggleSidebar();
            });

            Potree.loadPointCloud(
                "./pointclouds/Malecon1/metadata.json",
                "Malecon1",
                function(e) {
                    const pc = e.pointcloud;
                    pc.material.size = 1;
                    pc.material.activeAttributeName = "composite";
                    pc.material.weightRGB = 0;
                    pc.material.weightElevation = 1;
                    pc.material.weightIntensity = 1;
                    pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
                    pc.material.shape = Potree.PointShape.PARABOLOID;
                    window.viewer.scene.addPointCloud(pc);
                    window.viewer.fitToScreen();
                    fetchCurrentData();
                    setInterval(fetchCurrentData, 5000);
                }
            );
        });
    </script>
</body>
</html>
