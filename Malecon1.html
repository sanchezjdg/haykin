<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haykin</title>
    <link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
    <style>
        /* Fixed sensor data toggle button */
        #sensor-data-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
        }
        #sensor-data-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        /* Styled floating panel matching Potree annotation */
        #sensor-panel {
            position: fixed;
            top: 50px;
            right: 10px;
            width: 280px;
            background: rgba(20,20,20,0.9);
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.7);
            font-family: sans-serif;
            display: none;
            z-index: 1000;
        }
        #sensor-panel .header {
            background: rgba(40,40,40,0.95);
            padding: 6px 8px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #sensor-panel .header .close-btn {
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        #sensor-panel .content {
            padding: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
        <div id="potree_render_area" style="background-image: url('./libs/potree/resources/images/background.jpg');"></div>
        <div id="potree_sidebar_container"></div>
    </div>

    <!-- Toggle Button -->
    <button id="sensor-data-btn">Data</button>

    <!-- Floating Panel -->
    <div id="sensor-panel">
        <div class="header">
            <span>Data</span>
            <span class="close-btn">&times;</span>
        </div>
        <div class="content" id="sensor-content"></div>
    </div>

    <button id="clear-data-btn" style="position: fixed; top: 10px; right: 100px; z-index: 1000;
        background: rgba(0,0,0,0.6); color: #fff; border:none; padding:6px 12px;
        border-radius:4px; cursor:pointer;">Clear All</button>

    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <script src="./libs/d3/d3.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="../libs/three.js/build/three.min.js"></script>
    <script src="./libs/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>

    <script type="module">
        proj4.defs('EPSG:4326', '+proj=longlat +datum=WGS84 +no_defs');
        proj4.defs('EPSG:32618', '+proj=utm +zone=18 +datum=WGS84 +units=m +no_defs');

        window.addEventListener('load', async () => {
            if (!window.THREE && window.Potree) window.THREE = Potree.THREE;
            window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
            viewer.setEDLEnabled(true);
            viewer.setFOV(60);
            viewer.setPointBudget(2000000);
            viewer.loadSettingsFromURL();
            viewer.setDescription("");
            viewer.loadGUI(() => {
                viewer.setLanguage('en');
                $("#menu_appearance").next().show();
                $("#menu_tools").next().show();
                $("#menu_clipping").next().show();
                viewer.toggleSidebar();
            });
            Potree.loadPointCloud(
                "./pointclouds/Malecon1/metadata.json",
                "Malecon1",
                e => {
                    const pc = e.pointcloud;
                    pc.material.size = 1;
                    pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
                    pc.material.shape = Potree.PointShape.SQUARE;
                    viewer.scene.addPointCloud(pc);
                    viewer.fitToScreen();

                    let latestMarker;
                    async function fetchAndUpdate() {
                        try {
                            const res = await fetch('/latest');
                            if (!res.ok) return;
                            const data = await res.json();
                            document.getElementById('sensor-content').innerText =
                                `Light Level: ${data.light_level} lx\n` +
                                `Pressure: ${data.pressure} hPa\n` +
                                `Sound Level: ${data.sound_level} dB\n` +
                                `Magnetic Field (µT):\n  X: ${data.mag_x}\n  Y: ${data.mag_y}\n  Z: ${data.mag_z}`;

                            if (latestMarker) viewer.scene.removeMeasurement(latestMarker);
                            if (typeof data.latitude !== 'number' || typeof data.longitude !== 'number') return;
                            const { x, y, z } = convertToWorldCoordinates(data.latitude, data.longitude, data.altitude || 0);
                            const meas = new Potree.Measure();
                            meas.name = "Latest Point";
                            meas.showCoordinates = true;
                            meas.maxMarkers = 1;
                            meas.addMarker(new THREE.Vector3(x, y, z));
                            viewer.scene.addMeasurement(meas);
                            latestMarker = meas;
                        } catch (err) {
                            console.error(err);
                        }
                    }
                    fetchAndUpdate();
                    setInterval(fetchAndUpdate, 5000);
                }
            );

            // Toggle panel visibility
            $('#sensor-data-btn, #sensor-panel .close-btn').on('click', () => {
                $('#sensor-panel').toggle();
            });
            $('#clear-data-btn').on('click', () => {
                viewer.scene.removeAllMeasurements();
                $('#sensor-content').text('');
            });
        });

        function convertToWorldCoordinates(lat, lon, alt) {
            const [e, n] = proj4('EPSG:4326', 'EPSG:32618', [lon, lat]);
            return { x: e, y: n, z: alt + 34 };
        }
    </script>
</body>
</html>
